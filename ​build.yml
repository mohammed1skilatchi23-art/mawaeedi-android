name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          if [ -f "inshae-ttbyq.zip" ]; then
            unzip -o inshae-ttbyq.zip
            if [ ! -d "android" ] && [ ! -f "package.json" ]; then
              echo "Moving files from subfolder..."
              mv */* . 2>/dev/null || true
            fi
          else
            echo "File inshae-ttbyq.zip not found!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm install --force
          fi

      - name: Build Web Assets
        run: |
          if [ -f "package.json" ]; then
            npm run build --if-present
          fi

      - name: Sync Capacitor
        run: |
          if [ -d "android" ]; then
            npx cap sync android || true
          fi

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Directory 'android' not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
