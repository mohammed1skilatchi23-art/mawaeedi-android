
name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          echo "Extracting project..."
          unzip -o inshae-ttbyq.zip -d project
          echo "Searching project files..."
          find project -maxdepth 4 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Find project files
        run: |
          echo "Searching for package.json..."
          find project -name package.json -type f

          echo "Searching for gradlew..."
          find project -name gradlew -type f

      - name: Install dependencies and build web
        run: |
          PACKAGE_FILE=$(find project -name package.json -type f | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi

          PACKAGE_DIR=$(dirname "$PACKAGE_FILE")

          echo "Project directory: $PACKAGE_DIR"

          cd "$PACKAGE_DIR"

          npm install --legacy-peer-deps
          npm run build --if-present

          if [ -d "android" ]; then
            npx cap sync android
          else
            echo "ERROR: Android folder not found!"
            exit 1
          fi

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found!"
            find project -maxdepth 6 -type f
            exit 1
          fi

          echo "Found Gradle: $GRADLEW_PATH"

          GRADLE_DIR=$(dirname "$GRADLEW_PATH")

          cd "$GRADLE_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mawaeedi-app-debug
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
